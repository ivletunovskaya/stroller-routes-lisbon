# GraphHopper config for the Lisbon risk check.
# Run from the repository root (see spike/README.md).
graphhopper:
  datareader.file: data/lisbon.osm.pbf
  graph.location: data/graph-cache
  custom_models.directory: config

  # Elevation: DGT's 2 m LiDAR terrain model resampled to a one-arc-second HGT tile
  # (built by scripts/prepare_elevation.py), with SRTM filling gaps outside the DGT tiles.
  graph.elevation.provider: hgt
  graph.elevation.cache_dir: data/elevation-hgt
  graph.elevation.interpolate: bilinear
  graph.elevation.long_edge_sampling_distance: 20
  graph.elevation.edge_smoothing: moving_average
  graph.elevation.edge_smoothing.moving_average.window_size: 40

  graph.encoded_values: foot_access, foot_priority, foot_average_speed, foot_road_access, hike_rating, mtb_rating, country, average_slope, max_slope, road_class, road_environment, osm_way_id

  profiles:
    # Ordinary walking, used as the baseline that Google would roughly take.
    - name: foot
      custom_model_files: [foot.json]
    # No stairs, capped slopes, climbs cost more than descents.
    - name: stroller
      custom_model_files: [foot.json, stroller-model.json]
    # Stair-free alternatives with uphill limits from gentle to tolerant (spike/compare_routes.py).
    - name: stroller_up5
      custom_model_files: [foot.json, stroller-up5.json]
    - name: stroller_up7
      custom_model_files: [foot.json, stroller-up7.json]
    - name: stroller_up9
      custom_model_files: [foot.json, stroller-up9.json]
    - name: stroller_up12
      custom_model_files: [foot.json, stroller-up12.json]

  profiles_ch: []
  profiles_lm: []

  import.osm.ignored_highways: motorway,trunk
  prepare.min_network_size: 50

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost
